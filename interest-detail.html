<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兴趣详情</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f4f6ff;background-color:#030406;background-image:linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.48)),url("images/pexels-steve-whitelok-1142436-14614852.jpg");background-size:cover;background-position:center}
nav{padding:24px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18}
.logo{font-weight:bold;letter-spacing:2px}.logo span{color:#67e8f9}
nav div:last-child{display:flex;gap:22px}
nav a{color:#b9c4e8;text-decoration:none}
nav a:hover{color:#67e8f9}
.reflection{max-width:900px;margin:max(12px,calc(20vh - 80px)) auto 18px;padding:0 24px;color:#b8b8b8;font-size:clamp(20px,3vw,30px);line-height:1.8;text-align:center;text-shadow:0 2px 8px #000,0 0 16px #000}
.gallery{position:relative;width:min(900px,calc(100vw - 40px));height:min(56vh,620px);min-height:220px;margin:0 auto;display:grid;place-items:center;overflow:hidden}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.08);filter:blur(22px);transition:opacity .8s ease,transform 1.2s cubic-bezier(.2,.72,.25,1),filter 1.2s ease}
.slide.visible{opacity:1;transform:scale(1)}
.slide.preview.visible{opacity:.72;filter:blur(14px)}
.slide.clear.visible{filter:blur(0)}
.slide.leaving{opacity:0;transform:scale(.84);filter:blur(18px)}
#gallery-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;color:#b8b8b8;font-size:14px;text-shadow:0 2px 8px #000}
#unlock-panel{position:fixed;left:18px;bottom:18px;z-index:5;padding:9px 11px;border:1px solid #ffffff20;border-radius:8px;background:rgba(125,125,125,.24);color:#c4c4c4;backdrop-filter:blur(8px)}
#unlock-panel button,#unlock-panel input{font:inherit;color:#d0d0d0}
#unlock-trigger,#unlock-submit{border:1px solid #ffffff24;border-radius:5px;background:rgba(140,140,140,.18);padding:6px 9px;cursor:pointer}
#unlock-trigger{width:84px;height:32px;padding:0}
#unlock-form{display:flex;gap:6px;align-items:center}
#unlock-form[hidden]{display:none}
#unlock-password{width:128px;border:1px solid #ffffff30;border-radius:5px;background:rgba(0,0,0,.38);padding:6px 8px;outline:none}
#unlock-password::placeholder{color:#999}
#unlock-error{margin:7px 0 0;color:#c2c2c2;font-size:12px}
#unlock-error[hidden]{display:none}
@media(max-width:600px){nav{padding:20px 6%}nav div:last-child{gap:14px}}
</style>
</head>
<body>
<nav>
  <div class="logo">MY<span>SPACE</span>_</div>
  <div><a href="index.html">返回首页</a><a href="interests.html">返回兴趣</a></div>
</nav>
<main>
  <p class="reflection">这些图片，是我20岁的情愫，最美好，最动人，不知十年后还会有当初悸动否</p>
  <section class="gallery" id="gallery" aria-label="图片轮播"></section>
</main>
<aside id="unlock-panel">
  <button id="unlock-trigger" type="button" aria-label="解锁图片"></button>
  <form id="unlock-form" hidden>
    <input id="unlock-password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入密码" aria-label="输入密码" required>
    <button id="unlock-submit" type="submit">确认</button>
  </form>
  <p id="unlock-error" role="status" hidden></p>
</aside>
<script>
const images=Array.from({length:16},(_,index)=>{
  const name=`image-${String(index+1).padStart(2,'0')}`;
  return{
    encrypted:`images/${name}.jpg.enc`,
    preview:`images/${name}-preview.jpg`
  };
});
const salt=Uint8Array.from(atob('+k3qyafomgz8++P2uq2I5Q=='),character=>character.charCodeAt(0));
const gallery=document.getElementById('gallery');
const unlockPanel=document.getElementById('unlock-panel');
const unlockTrigger=document.getElementById('unlock-trigger');
const unlockForm=document.getElementById('unlock-form');
const passwordInput=document.getElementById('unlock-password');
const unlockError=document.getElementById('unlock-error');
let currentSlide=null;
let currentBlobUrl=null;
let previewIndex=0;
let previewTimer=0;
let unlocked=false;

function wait(milliseconds){
  return new Promise(resolve=>window.setTimeout(resolve,milliseconds));
}

function reportImageFailure(stage,error,path=''){
  console.error(
    `[interest-detail] ${stage} failed${path?` for "${path}"`:''}:`,
    error,
    {name:error?.name||'Error',message:error?.message||String(error)}
  );
}

function makeSlide(source,type){
  const image=document.createElement('img');
  image.className=`slide ${type}`;
  image.alt='';
  image.draggable=false;
  gallery.append(image);
  image.addEventListener('error',()=>{
    reportImageFailure('image display',new Error(`Image request failed (naturalWidth=${image.naturalWidth})`),source);
  },{once:true});
  image.addEventListener('load',()=>{
    requestAnimationFrame(()=>image.classList.add('visible'));
  },{once:true});
  image.src=source;
  return image;
}

function showPreview(){
  if(unlocked) return;
  currentSlide=makeSlide(images[previewIndex].preview,'preview');
  previewTimer=window.setTimeout(async()=>{
    const previous=currentSlide;
    if(previous){
      previous.classList.remove('visible');
      previous.classList.add('leaving');
      await wait(850);
      previous.remove();
    }
    if(unlocked) return;
    previewIndex=(previewIndex+1)%images.length;
    showPreview();
  },3500);
}

async function deriveImageKey(password){
  try{
    const passwordMaterial=await window.crypto.subtle.importKey(
      'raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']
    );
    const key=await window.crypto.subtle.deriveKey(
      {name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},
      passwordMaterial,
      {name:'AES-GCM',length:256},
      false,
      ['decrypt']
    );
    console.info('[interest-detail] password key derivation succeeded (PBKDF2-SHA-256, 310000 iterations).');
    return key;
  }catch(error){
    reportImageFailure('password key derivation',error);
    throw Object.assign(new Error(`Password key derivation failed: ${error.message}`,{cause:error}),{stage:'password key derivation'});
  }
}

async function decryptImage(key,index){
  const path=images[index].encrypted;
  let response;
  try{
    response=await fetch(path);
  }catch(error){
    reportImageFailure('fetch',error,path);
    throw Object.assign(new Error(`Fetch failed for ${path}: ${error.message}`,{cause:error}),{stage:'fetch'});
  }
  if(!response.ok){
    const error=new Error(`HTTP ${response.status} ${response.statusText}`);
    reportImageFailure('fetch',error,path);
    throw Object.assign(error,{stage:'fetch'});
  }

  let data;
  try{
    data=new Uint8Array(await response.arrayBuffer());
    if(data.length<=28) throw new Error(`Binary file is incomplete (${data.length} bytes)`);
    console.info(`[interest-detail] "${path}" fetched as binary (${data.length} bytes; 12-byte IV + ciphertext + 16-byte tag; not Base64).`);
  }catch(error){
    reportImageFailure('binary response read',error,path);
    throw Object.assign(new Error(`Could not read binary response for ${path}: ${error.message}`,{cause:error}),{stage:'binary response read'});
  }

  let plaintext;
  try{
    plaintext=await window.crypto.subtle.decrypt(
      {name:'AES-GCM',iv:data.subarray(0,12),tagLength:128},
      key,
      data.subarray(12)
    );
    console.info(`[interest-detail] AES-GCM decryption succeeded for "${path}" (${plaintext.byteLength} bytes).`);
  }catch(error){
    reportImageFailure('AES-GCM decryption',error,path);
    throw Object.assign(new Error(`AES-GCM decryption failed for ${path}: ${error.message}`,{cause:error}),{stage:'AES-GCM decryption'});
  }

  let blob;
  try{
    blob=new Blob([plaintext],{type:'image/jpeg'});
    console.info(`[interest-detail] JPEG Blob created for "${path}" (${blob.size} bytes).`);
  }catch(error){
    reportImageFailure('Blob creation',error,path);
    throw Object.assign(new Error(`Blob creation failed for ${path}: ${error.message}`,{cause:error}),{stage:'Blob creation'});
  }

  try{
    const blobUrl=URL.createObjectURL(blob);
    console.info(`[interest-detail] Blob URL created for "${path}".`);
    return blobUrl;
  }catch(error){
    reportImageFailure('Blob URL creation',error,path);
    throw Object.assign(new Error(`Blob URL creation failed for ${path}: ${error.message}`,{cause:error}),{stage:'Blob URL creation'});
  }
}

async function removeCurrentSlide(){
  if(!currentSlide) return;
  const slide=currentSlide;
  const blobUrl=currentBlobUrl;
  currentSlide=null;
  currentBlobUrl=null;
  slide.classList.remove('visible');
  slide.classList.add('leaving');
  await wait(850);
  slide.remove();
  if(blobUrl) URL.revokeObjectURL(blobUrl);
}

async function playSlideshow(key,firstBlobUrl){
  let index=0;
  let nextBlobUrl=firstBlobUrl;
  await removeCurrentSlide();
  while(unlocked){
    currentBlobUrl=nextBlobUrl;
    currentSlide=makeSlide(nextBlobUrl,'clear');
    await new Promise((resolve,reject)=>{
      if(currentSlide.complete&&currentSlide.naturalWidth) resolve();
      else{
        currentSlide.addEventListener('load',resolve,{once:true});
        currentSlide.addEventListener('error',()=>{
          const error=new Error(`Decrypted image "${images[index].encrypted}" could not be displayed`);
          reportImageFailure('Blob image display',error,images[index].encrypted);
          reject(error);
        },{once:true});
      }
    });
    requestAnimationFrame(()=>currentSlide?.classList.add('visible'));
    await wait(3500);
    await removeCurrentSlide();
    if(!unlocked) break;
    index=(index+1)%images.length;
    try{
      nextBlobUrl=await decryptImage(key,index);
    }catch(error){
      reportImageFailure('slideshow',error,images[index].encrypted);
      unlockError.textContent='图片加载失败，请刷新页面后重试。';
      unlockError.hidden=false;
      unlockPanel.hidden=false;
      unlockForm.hidden=true;
      unlockTrigger.hidden=false;
      break;
    }
  }
}

unlockTrigger.addEventListener('click',()=>{
  unlockTrigger.hidden=true;
  unlockForm.hidden=false;
  passwordInput.focus();
});

unlockForm.addEventListener('submit',async event=>{
  event.preventDefault();
  unlockError.hidden=true;
  unlockForm.querySelector('button').disabled=true;
  try{
    if(!window.crypto?.subtle){
      const error=new Error('Web Crypto API is unavailable. Use HTTPS or localhost.');
      reportImageFailure('Web Crypto availability',error);
      throw Object.assign(error,{stage:'Web Crypto availability'});
    }
    const key=await deriveImageKey(passwordInput.value);
    const firstBlobUrl=await decryptImage(key,0);
    unlocked=true;
    window.clearTimeout(previewTimer);
    unlockPanel.hidden=true;
    console.info(`[interest-detail] First image decrypted successfully (${images[0].encrypted}); starting slideshow.`);
    playSlideshow(key,firstBlobUrl).catch(error=>{
      reportImageFailure('slideshow',error,images[0].encrypted);
      unlockError.textContent='图片播放失败，请重新解锁后重试。';
      unlockError.hidden=false;
      unlockPanel.hidden=false;
      unlockForm.hidden=true;
      unlockTrigger.hidden=false;
    });
  }catch(error){
    if(error.stage==='AES-GCM decryption'&&error.cause?.name==='OperationError'){
      unlockError.textContent='密码错误，请重试。';
    }else{
      reportImageFailure('unlock',error);
      unlockError.textContent=`图片解锁失败（${error.stage||error.name}），请查看控制台详情。`;
    }
    unlockError.hidden=false;
  }finally{
    unlockForm.querySelector('button').disabled=false;
    passwordInput.value='';
    if(!unlocked) passwordInput.focus();
  }
});

window.addEventListener('pagehide',()=>{
  window.clearTimeout(previewTimer);
  if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
});

showPreview();
</script>
</body>
</html>
