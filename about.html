<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于我 | 我的数字空间</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f4f6ff;background-color:#080b16;background-image:linear-gradient(rgba(8,11,22,.58),rgba(8,11,22,.72)),var(--background-image,url("images/pexels-pamanjoe-28225646.jpg"));background-position:center;background-size:cover;overflow-x:hidden}
nav{padding:24px 8%;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18}
.logo{font-weight:bold;letter-spacing:2px}.logo span{color:#67e8f9}
nav a{color:#b9c4e8;text-decoration:none}
main{max-width:1000px;margin:auto;padding:100px 25px 70px}
.label{color:#67e8f9;letter-spacing:3px;font-size:12px}
h1{font-size:clamp(42px,8vw,78px);line-height:1.1;margin:22px 0}
.gradient{background:linear-gradient(90deg,#67e8f9,#a78bfa,#f0abfc);color:transparent;background-clip:text}
p{color:#aab4d0;line-height:1.9;max-width:600px}
.background-control{margin-top:16px;padding:12px 18px;border:1px solid #ffffff40;border-radius:10px;background:#ffffff18;color:#f4f6ff;font:inherit;cursor:pointer}
.background-control:hover{background:#ffffff30}
.more-link{display:inline-block;margin-top:0;text-decoration:none}
#background-status{min-height:1.5em;margin:10px 0;color:#ffd2d2;font-size:14px}
footer{padding:25px;text-align:center;color:#7180a8;font-size:12px}
</style>
</head>
<body>
<nav><div class="logo">MY<span>SPACE</span>_</div><a href="index.html">返回首页</a></nav>
<main>
<div class="label">关于我</div>
<h1>你好，我是<br><span class="gradient">淡淡。</span></h1>
<p>最近很喜欢改编《少年行》的一句话，“当时年少掷春光，花马踏蹄酒溅香。”</p>
<button class="background-control" id="change-background" type="button">切换背景图片</button>
<p id="background-status" aria-live="polite"></p>
<a class="background-control more-link" href="skills.html">更多的我</a>
</main>
<footer>© <span id="year"></span> MY SPACE · 用好奇心创造可能</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const backgrounds=[
  "pexels-pamanjoe-28225646.jpg",
  "pexels-aepsean-40291257.jpg",
  "pexels-alexis-b-1699196-40131904.jpg",
  "pexels-doouglasma-14888364.jpg",
  "pexels-jean-paul-wettstein-677916508-39580969.jpg",
  "pexels-tim-tim-chan-326719935-16401491.jpg"
];
let currentBackground=0;
const status=document.getElementById('background-status');
function showBackground(index){
  const imagePath=`images/${backgrounds[index]}`;
  document.body.style.setProperty('--background-image',`url("${imagePath}")`);
  const image=new Image();
  image.onload=()=>{status.textContent='';};
  image.onerror=()=>{status.textContent=`背景图片加载失败（${imagePath}），请重新上传该图片。`;};
  image.src=imagePath;
}
showBackground(currentBackground);
document.getElementById('change-background').addEventListener('click',()=>{
  currentBackground=(currentBackground+1)%backgrounds.length;
  showBackground(currentBackground);
});
</script>
</body>
</html>
