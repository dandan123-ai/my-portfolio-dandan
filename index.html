<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的数字空间</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f4f6ff;background:#030406;overflow-x:hidden}
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav,main,footer{position:relative;z-index:1}
nav{padding:24px 8%;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18}
.logo{font-weight:bold;letter-spacing:2px}.logo span{color:#67e8f9}
nav a{color:#b9c4e8;text-decoration:none;margin-left:22px}
main{max-width:1000px;margin:auto;padding:100px 25px 70px}
.label{color:#67e8f9;letter-spacing:3px;font-size:12px}
h1{font-size:clamp(42px,8vw,78px);line-height:1.1;margin:22px 0}
.gradient{background:linear-gradient(90deg,#67e8f9,#a78bfa,#f0abfc);color:transparent;background-clip:text}
p{color:#aab4d0;line-height:1.9;max-width:600px}
button{margin-top:20px;padding:13px 22px;border:0;border-radius:10px;background:linear-gradient(90deg,#67e8f9,#a78bfa);font-weight:bold;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:65px}
.card{padding:24px;border:1px solid #8b9cff35;border-radius:18px;background:#ffffff09;backdrop-filter:blur(12px);transition:.3s;color:inherit;text-decoration:none}
.card:hover{transform:translateY(-7px);border-color:#67e8f9}
footer{padding:25px;text-align:center;color:#7180a8;font-size:12px}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<nav><div class="logo">MY<span>SPACE</span>_</div><div><a href="#about">关于我</a><a href="#projects">项目</a></div></nav>
<main>
<section id="about">
<div class="label">关于我</div>
<h1>陌生人你好，我叫淡淡。</h1>
<p>“淡淡”这个网名，是我好几年前取的，出自《庄子·山木》：“君子淡以亲，小人甘以绝。彼无故以合者，则无故以离”。不过，我总觉得“小人”更贴合，也更自在。</p>
<button onclick="document.querySelector('#projects').scrollIntoView({behavior:'smooth'})">探索我的作品 ↘</button>
</section>
<section class="cards" id="projects">
<a class="card" href="about.html"><div>✦ 关于我</div></a>
<a class="card" href="skills.html"><div>⌘ 技能与兴趣</div></a>
<div class="card"><div>◈ 我的项目</div></div>
</section>
</main>
<footer>© <span id="year"></span> MY SPACE · 用好奇心创造可能</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();

const canvas=document.getElementById('starfield');
const context=canvas.getContext('2d');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const desktopPointer=window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 768px)');
let stars=[];
let meteor=null;
let meteorCountdown=0;
let interactionParticles=[];
let clickWaves=[];
let lastPointer=null;
let pointerListenersEnabled=false;
let frameId=0;
let lastFrame=0;
let lastDrawTime=0;
let lastInteractionDrawTime=0;
let width=0;
let height=0;
const maxInteractionParticles=64;

function meteorInterval(){
  return width<600?7000+Math.random()*5000:2800+Math.random()*3000;
}

function resizeStarfield(){
  const pixelRatio=Math.min(window.devicePixelRatio||1,2);
  width=window.innerWidth;
  height=window.innerHeight;
  canvas.width=Math.round(width*pixelRatio);
  canvas.height=Math.round(height*pixelRatio);
  context.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  const count=Math.max(40,Math.min(130,Math.round(width*height/14000)))*12;
  stars=Array.from({length:count},()=>({
    x:Math.random()*width,
    y:Math.random()*height,
    radius:Math.random()*0.8+0.45,
    phase:Math.random()*Math.PI*2,
    speed:(Math.random()-0.5)*0.012,
    drift:(Math.random()-0.5)*0.012
  }));
  if(!meteorCountdown) meteorCountdown=meteorInterval();
  lastDrawTime=0;
  if(reducedMotion.matches) drawStarfield(0,false);
}

function drawStarfield(time,animate){
  context.clearRect(0,0,width,height);
  const elapsed=animate&&lastDrawTime?Math.min(time-lastDrawTime,100):0;
  lastDrawTime=time;

  if(animate){
    for(const star of stars){
      star.x+=star.speed*elapsed;
      star.y+=star.drift*elapsed;
      if(star.x<0) star.x=width;
      if(star.x>width) star.x=0;
      if(star.y<0) star.y=height;
      if(star.y>height) star.y=0;
    }
  }

  const connectionDistance=65;
  const nearbyStars=new Map();
  for(let i=0;i<stars.length;i++){
    const star=stars[i];
    const cellX=Math.floor(star.x/connectionDistance);
    const cellY=Math.floor(star.y/connectionDistance);
    const key=`${cellX},${cellY}`;
    if(!nearbyStars.has(key)) nearbyStars.set(key,[]);
    nearbyStars.get(key).push(i);
  }
  context.lineWidth=0.6;
  for(let i=0;i<stars.length;i++){
    const star=stars[i];
    const cellX=Math.floor(star.x/connectionDistance);
    const cellY=Math.floor(star.y/connectionDistance);
    for(let offsetX=-1;offsetX<=1;offsetX++){
      for(let offsetY=-1;offsetY<=1;offsetY++){
        const neighbors=nearbyStars.get(`${cellX+offsetX},${cellY+offsetY}`)||[];
        for(const j of neighbors){
          if(j<=i) continue;
          const other=stars[j];
          const distance=Math.hypot(star.x-other.x,star.y-other.y);
          if(distance<connectionDistance){
            context.strokeStyle=`rgba(190,205,225,${(1-distance/connectionDistance)*0.12})`;
            context.beginPath();
            context.moveTo(star.x,star.y);
            context.lineTo(other.x,other.y);
            context.stroke();
          }
        }
      }
    }
  }

  for(const star of stars){
    const twinkle=animate?(Math.sin(time*0.0007+star.phase)+1)/2:0.5;
    context.fillStyle=`rgba(235,242,255,${0.35+twinkle*0.55})`;
    context.beginPath();
    context.arc(star.x,star.y,star.radius,0,Math.PI*2);
    context.fill();
  }

  drawScorpius(time,animate);
  drawMeteor(animate,elapsed);
  drawInteractionEffects(time,animate);
}

function drawMeteor(animate,elapsed){
  if(!animate){
    meteor=null;
    return;
  }

  if(!meteor){
    meteorCountdown-=elapsed;
    if(meteorCountdown<=0){
      const mobile=width<600;
      meteor={
        elapsed:0,
        duration:mobile?650:850,
        startX:width+12,
        startY:8+Math.random()*24,
        distance:mobile?Math.min(width*0.32,130):Math.min(width*0.3,360),
        tailLength:mobile?34:68
      };
      meteorCountdown=meteorInterval();
    }
  }
  if(!meteor) return;

  meteor.elapsed+=elapsed;
  const progress=Math.min(meteor.elapsed/meteor.duration,1);
  const x=meteor.startX-meteor.distance*progress;
  const y=meteor.startY+meteor.distance*0.34*progress;
  const tailX=x+meteor.tailLength;
  const tailY=y-meteor.tailLength*0.34;
  const opacity=Math.sin(Math.PI*progress)*(width<600?0.3:0.4);
  const trail=context.createLinearGradient(tailX,tailY,x,y);
  trail.addColorStop(0,'rgba(230,237,250,0)');
  trail.addColorStop(0.7,`rgba(196,166,255,${opacity*0.55})`);
  trail.addColorStop(1,`rgba(225,210,255,${opacity})`);

  context.save();
  context.strokeStyle=trail;
  context.lineWidth=1.3;
  context.shadowColor='rgba(196,166,255,0.3)';
  context.shadowBlur=8;
  context.beginPath();
  context.moveTo(tailX,tailY);
  context.lineTo(x,y);
  context.stroke();
  context.restore();

  if(progress>=1) meteor=null;
}

function drawScorpius(time,animate){
  const mobile=width<600;
  const constellationWidth=mobile?Math.min(132,width*0.36):Math.min(245,width*0.22);
  const constellationHeight=mobile?Math.min(250,height*0.36):Math.min(390,height*0.5);
  const originX=width-constellationWidth-(mobile?12:Math.max(28,width*0.045));
  const originY=mobile?Math.max(110,height-constellationHeight-26):Math.max(110,height*0.2);
  const points=[
    [0.62,0.08],[0.78,0.10],[0.94,0.14],
    [0.70,0.22],[0.61,0.34],[0.50,0.43],
    [0.39,0.52],[0.28,0.61],[0.20,0.72],
    [0.24,0.82],[0.36,0.88],[0.49,0.83],
    [0.53,0.73],[0.44,0.72]
  ];
  const connections=[
    [0,1],[1,2],[0,3],[1,3],[3,4],[4,5],[5,6],[6,7],
    [7,8],[8,9],[9,10],[10,11],[11,12],[12,13],[13,10]
  ];

  context.lineWidth=0.8;
  context.strokeStyle='rgba(190,205,225,0.18)';
  for(const [from,to] of connections){
    context.beginPath();
    context.moveTo(originX+points[from][0]*constellationWidth,originY+points[from][1]*constellationHeight);
    context.lineTo(originX+points[to][0]*constellationWidth,originY+points[to][1]*constellationHeight);
    context.stroke();
  }

  for(let i=0;i<points.length;i++){
    const [x,y]=points[i];
    const twinkle=animate?(Math.sin(time*0.00055+i*1.7)+1)/2:0.5;
    const radius=i===5?2.2:1.35+(i%3)*0.2;
    context.fillStyle=i===5
      ?`rgba(255,205,170,${0.68+twinkle*0.22})`
      :`rgba(225,235,250,${0.62+twinkle*0.3})`;
    context.beginPath();
    context.arc(originX+x*constellationWidth,originY+y*constellationHeight,radius,0,Math.PI*2);
    context.fill();
  }
}

function addInteractionParticle(x,y,vx,vy,lifetime,color,opacity){
  if(interactionParticles.length>=maxInteractionParticles) interactionParticles.shift();
  interactionParticles.push({x,y,vx,vy,lifetime,remaining:lifetime,color,opacity,radius:Math.random()*0.8+0.55});
}

function handleMouseMove(event){
  if(!lastPointer){
    lastPointer={x:event.clientX,y:event.clientY};
    return;
  }
  const dx=event.clientX-lastPointer.x;
  const dy=event.clientY-lastPointer.y;
  const distance=Math.hypot(dx,dy);
  const steps=Math.min(5,Math.floor(distance/18));
  if(!steps) return;
  const colors=['190,220,255','232,239,248','205,195,245'];
  for(let i=1;i<=steps;i++){
    const progress=i/steps;
    const x=lastPointer.x+dx*progress;
    const y=lastPointer.y+dy*progress;
    addInteractionParticle(
      x+(Math.random()-0.5)*5,
      y+(Math.random()-0.5)*5,
      (Math.random()-0.5)*0.025,
      (Math.random()-0.5)*0.025,
      420+Math.random()*300,
      colors[Math.floor(Math.random()*colors.length)],
      0.42
    );
  }
  lastPointer={x:event.clientX,y:event.clientY};
}

function handleMouseClick(event){
  const colors=['190,220,255','232,239,248','205,195,245'];
  for(let i=0;i<10;i++){
    const angle=(Math.PI*2*i)/10+Math.random()*0.35;
    const speed=0.025+Math.random()*0.035;
    addInteractionParticle(
      event.clientX,
      event.clientY,
      Math.cos(angle)*speed,
      Math.sin(angle)*speed,
      480+Math.random()*180,
      colors[Math.floor(Math.random()*colors.length)],
      0.5
    );
  }
  if(clickWaves.length>=2) clickWaves.shift();
  clickWaves.push({x:event.clientX,y:event.clientY,elapsed:0,lifetime:560});
}

function clearInteractionEffects(){
  interactionParticles=[];
  clickWaves=[];
  lastPointer=null;
}

function updatePointerListeners(){
  const shouldEnable=desktopPointer.matches&&!reducedMotion.matches;
  if(shouldEnable===pointerListenersEnabled) return;
  pointerListenersEnabled=shouldEnable;
  if(shouldEnable){
    window.addEventListener('mousemove',handleMouseMove,{passive:true});
    window.addEventListener('click',handleMouseClick,{passive:true});
  }else{
    window.removeEventListener('mousemove',handleMouseMove);
    window.removeEventListener('click',handleMouseClick);
    clearInteractionEffects();
  }
}

function drawInteractionEffects(time,animate){
  if(!animate){
    clearInteractionEffects();
    lastInteractionDrawTime=0;
    return;
  }
  const elapsed=lastInteractionDrawTime?Math.min(time-lastInteractionDrawTime,100):0;
  lastInteractionDrawTime=time;

  interactionParticles=interactionParticles.filter(particle=>{
    particle.remaining-=elapsed;
    particle.x+=particle.vx*elapsed;
    particle.y+=particle.vy*elapsed;
    if(particle.remaining<=0) return false;
    const opacity=particle.opacity*(particle.remaining/particle.lifetime)**2;
    context.fillStyle=`rgba(${particle.color},${opacity})`;
    context.beginPath();
    context.arc(particle.x,particle.y,particle.radius,0,Math.PI*2);
    context.fill();
    return true;
  });

  clickWaves=clickWaves.filter(wave=>{
    wave.elapsed+=elapsed;
    const progress=Math.min(wave.elapsed/wave.lifetime,1);
    if(progress>=1) return false;
    context.strokeStyle=`rgba(210,222,248,${0.2*(1-progress)})`;
    context.lineWidth=0.8;
    context.beginPath();
    context.arc(wave.x,wave.y,4+progress*23,0,Math.PI*2);
    context.stroke();
    return true;
  });
}

function animateStarfield(time){
  frameId=0;
  if(document.hidden) return;
  if(time-lastFrame>=33){
    lastFrame=time;
    drawStarfield(time,true);
  }
  frameId=window.requestAnimationFrame(animateStarfield);
}

function startStarfield(){
  if(!frameId&&!reducedMotion.matches&&!document.hidden){
    frameId=window.requestAnimationFrame(animateStarfield);
  }
}

function stopStarfield(){
  if(frameId){
    window.cancelAnimationFrame(frameId);
    frameId=0;
  }
}

resizeStarfield();
updatePointerListeners();
startStarfield();
window.addEventListener('resize',resizeStarfield,{passive:true});
desktopPointer.addEventListener('change',updatePointerListeners);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    stopStarfield();
    clearInteractionEffects();
    lastInteractionDrawTime=0;
  }else startStarfield();
});
reducedMotion.addEventListener('change',()=>{
  stopStarfield();
  updatePointerListeners();
  drawStarfield(0,false);
  startStarfield();
});
</script>
</body>
</html>
