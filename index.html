<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的数字空间</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f4f6ff;background:#030406;overflow-x:hidden}
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav,main,footer{position:relative;z-index:1}
nav{padding:24px 8%;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18}
.logo{font-weight:bold;letter-spacing:2px}.logo span{color:#67e8f9}
nav a{color:#b9c4e8;text-decoration:none;margin-left:22px}
main{max-width:1000px;margin:auto;padding:100px 25px 70px}
.label{color:#67e8f9;letter-spacing:3px;font-size:12px}
h1{font-size:clamp(42px,8vw,78px);line-height:1.1;margin:22px 0}
.gradient{background:linear-gradient(90deg,#67e8f9,#a78bfa,#f0abfc);color:transparent;background-clip:text}
p{color:#aab4d0;line-height:1.9;max-width:600px}
button{margin-top:20px;padding:13px 22px;border:0;border-radius:10px;background:linear-gradient(90deg,#67e8f9,#a78bfa);font-weight:bold;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:65px}
.card{padding:24px;border:1px solid #8b9cff35;border-radius:18px;background:#ffffff09;backdrop-filter:blur(12px);transition:.3s;color:inherit;text-decoration:none}
.card:hover{transform:translateY(-7px);border-color:#67e8f9}
footer{padding:25px;text-align:center;color:#7180a8;font-size:12px}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<nav><div class="logo">MY<span>SPACE</span>_</div><div><a href="#about">关于我</a><a href="#projects">项目</a></div></nav>
<main>
<section id="about">
<div class="label">关于我</div>
<h1>陌生人你好，我叫淡淡。</h1>
<p>你好，我是淡淡。我正在学习人工智能、网页设计和数字创作，希望用技术和创意制作有趣的作品。</p>
<button onclick="document.querySelector('#projects').scrollIntoView({behavior:'smooth'})">探索我的作品 ↘</button>
</section>
<section class="cards" id="projects">
<a class="card" href="about.html"><div>✦ 关于我</div></a>
<a class="card" href="skills.html"><div>⌘ 技能与兴趣</div></a>
<div class="card"><div>◈ 我的项目</div></div>
</section>
</main>
<footer>© <span id="year"></span> MY SPACE · 用好奇心创造可能</footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();

const canvas=document.getElementById('starfield');
const context=canvas.getContext('2d');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let stars=[];
let frameId=0;
let lastFrame=0;
let lastDrawTime=0;
let width=0;
let height=0;

function resizeStarfield(){
  const pixelRatio=Math.min(window.devicePixelRatio||1,2);
  width=window.innerWidth;
  height=window.innerHeight;
  canvas.width=Math.round(width*pixelRatio);
  canvas.height=Math.round(height*pixelRatio);
  context.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  const count=Math.max(40,Math.min(130,Math.round(width*height/14000)));
  stars=Array.from({length:count},()=>({
    x:Math.random()*width,
    y:Math.random()*height,
    radius:Math.random()*0.8+0.45,
    phase:Math.random()*Math.PI*2,
    speed:(Math.random()-0.5)*0.012,
    drift:(Math.random()-0.5)*0.012
  }));
  lastDrawTime=0;
  if(reducedMotion.matches) drawStarfield(0,false);
}

function drawStarfield(time,animate){
  context.clearRect(0,0,width,height);
  const elapsed=animate&&lastDrawTime?Math.min(time-lastDrawTime,100):0;
  lastDrawTime=time;

  if(animate){
    for(const star of stars){
      star.x+=star.speed*elapsed;
      star.y+=star.drift*elapsed;
      if(star.x<0) star.x=width;
      if(star.x>width) star.x=0;
      if(star.y<0) star.y=height;
      if(star.y>height) star.y=0;
    }
  }

  const connectionDistance=105;
  context.lineWidth=0.6;
  for(let i=0;i<stars.length;i++){
    const star=stars[i];
    for(let j=i+1;j<stars.length;j++){
      const other=stars[j];
      const dx=star.x-other.x;
      const dy=star.y-other.y;
      const distance=Math.hypot(dx,dy);
      if(distance<connectionDistance){
        context.strokeStyle=`rgba(190,205,225,${(1-distance/connectionDistance)*0.12})`;
        context.beginPath();
        context.moveTo(star.x,star.y);
        context.lineTo(other.x,other.y);
        context.stroke();
      }
    }
  }

  for(const star of stars){
    const twinkle=animate?(Math.sin(time*0.0007+star.phase)+1)/2:0.5;
    context.fillStyle=`rgba(235,242,255,${0.35+twinkle*0.55})`;
    context.beginPath();
    context.arc(star.x,star.y,star.radius,0,Math.PI*2);
    context.fill();
  }
}

function animateStarfield(time){
  frameId=0;
  if(document.hidden) return;
  if(time-lastFrame>=33){
    lastFrame=time;
    drawStarfield(time,true);
  }
  frameId=window.requestAnimationFrame(animateStarfield);
}

function startStarfield(){
  if(!frameId&&!reducedMotion.matches&&!document.hidden){
    frameId=window.requestAnimationFrame(animateStarfield);
  }
}

function stopStarfield(){
  if(frameId){
    window.cancelAnimationFrame(frameId);
    frameId=0;
  }
}

resizeStarfield();
startStarfield();
window.addEventListener('resize',resizeStarfield,{passive:true});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopStarfield();
  else startStarfield();
});
reducedMotion.addEventListener('change',()=>{
  stopStarfield();
  drawStarfield(0,false);
  startStarfield();
});
</script>
</body>
</html>
