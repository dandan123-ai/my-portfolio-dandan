<script>
document.getElementById('year').textContent=new Date().getFullYear();

const projectCard=document.querySelector('.project-card');
projectCard.addEventListener('click',event=>{
  event.preventDefault();
  try{
    const AudioContextConstructor=window.AudioContext||window.webkitAudioContext;
    if(AudioContextConstructor){
      const audioContext=new AudioContextConstructor();
      const playEntryKeySound=()=>{
        if(audioContext.state!=='running') return;
        const oscillator=audioContext.createOscillator();
        const gain=audioContext.createGain();
        const now=audioContext.currentTime;
        oscillator.type='triangle';
        oscillator.frequency.value=650+Math.random()*300;
        gain.gain.setValueAtTime(0.018,now);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+0.025);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now+0.025);
      };
      if(audioContext.state==='suspended'){
        audioContext.resume().then(playEntryKeySound).catch(error=>{
          console.warn('Keyboard sound is unavailable.',error);
        });
      }else playEntryKeySound();
    }
  }catch(error){
    console.warn('Keyboard sound is unavailable.',error);
  }
  window.setTimeout(()=>window.location.href=projectCard.href,40);
});

const canvas=document.getElementById('starfield');
const context=canvas.getContext('2d');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const desktopPointer=window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 768px)');
let stars=[];
let meteors=[];
let meteorWait=800;
let nextMeteorIndex=0;
let meteorSparks=[];
let interactionParticles=[];
let clickWaves=[];
let lastPointer=null;
let pointerListenersEnabled=false;
let frameId=0;
let lastFrame=0;
let lastDrawTime=0;
let lastInteractionDrawTime=0;
let width=0;
let height=0;
const maxInteractionParticles=64;

function resizeStarfield(){
  const pixelRatio=Math.min(window.devicePixelRatio||1,2);
  width=window.innerWidth;
  height=window.innerHeight;
  canvas.width=Math.round(width*pixelRatio);
  canvas.height=Math.round(height*pixelRatio);
  context.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  const count=Math.max(40,Math.min(130,Math.round(width*height/14000)))*12;
  stars=Array.from({length:count},()=>({
    x:Math.random()*width,
    y:Math.random()*height,
    radius:Math.random()*0.8+0.45,
    phase:Math.random()*Math.PI*2,
    speed:(Math.random()-0.5)*0.012,
    drift:(Math.random()-0.5)*0.012
  }));
  meteors=[];
  meteorWait=800+Math.random()*900;
  meteorSparks=[];
  lastDrawTime=0;
  if(reducedMotion.matches) drawStarfield(0,false);
}

function drawStarfield(time,animate){
  context.clearRect(0,0,width,height);
  const elapsed=animate&&lastDrawTime?Math.min(time-lastDrawTime,100):0;
  lastDrawTime=time;

  if(animate){
    for(const star of stars){
      star.x+=star.speed*elapsed;
      star.y+=star.drift*elapsed;
      if(star.x<0) star.x=width;
      if(star.x>width) star.x=0;
      if(star.y<0) star.y=height;
      if(star.y>height) star.y=0;
    }
  }

  const connectionDistance=65;
  const nearbyStars=new Map();
  for(let i=0;i<stars.length;i++){
    const star=stars[i];
    const cellX=Math.floor(star.x/connectionDistance);
    const cellY=Math.floor(star.y/connectionDistance);
    const key=`${cellX},${cellY}`;
    if(!nearbyStars.has(key)) nearbyStars.set(key,[]);
    nearbyStars.get(key).push(i);
  }
  context.lineWidth=0.6;
  for(let i=0;i<stars.length;i++){
    const star=stars[i];
    const cellX=Math.floor(star.x/connectionDistance);
    const cellY=Math.floor(star.y/connectionDistance);
    for(let offsetX=-1;offsetX<=1;offsetX++){
      for(let offsetY=-1;offsetY<=1;offsetY++){
        const neighbors=nearbyStars.get(`${cellX+offsetX},${cellY+offsetY}`)||[];
        for(const j of neighbors){
          if(j<=i) continue;
          if((i+j)%2!==0) continue;
          const other=stars[j];
          const distance=Math.hypot(star.x-other.x,star.y-other.y);
          if(distance<connectionDistance){
            context.strokeStyle=`rgba(190,205,225,${(1-distance/connectionDistance)*0.12})`;
            context.beginPath();
            context.moveTo(star.x,star.y);
            context.lineTo(other.x,other.y);
            context.stroke();
          }
        }
      }
    }
  }

  for(const star of stars){
    const twinkle=animate?(Math.sin(time*0.0007+star.phase)+1)/2:0.5;
    context.fillStyle=`rgba(235,242,255,${0.28+twinkle*0.45})`;
    context.beginPath();
    context.arc(star.x,star.y,star.radius,0,Math.PI*2);
    context.fill();
  }

  drawScorpius(time,animate);
  drawMeteor(animate,elapsed);
  drawInteractionEffects(time,animate);
}

function drawMeteor(animate,elapsed){
  if(animate){
    if(meteors.length<2){
      meteorWait-=elapsed;
      if(meteorWait<=0){
        meteors.push(createMeteor(nextMeteorIndex));
        nextMeteorIndex=(nextMeteorIndex+1)%2;
        meteorWait=4200+Math.random()*2200;
      }
    }

    for(const meteor of meteors){
      meteor.elapsed+=elapsed;
    }
    meteors=meteors.filter(meteor=>meteor.elapsed<meteor.duration);
  }

  for(const meteor of meteors){
    const progress=Math.min(meteor.elapsed/meteor.duration,1);
    const easedProgress=progress+Math.sin(progress*Math.PI*2)*0.018;
    const head=meteorPoint(meteor,easedProgress);
    const tangent=meteorTangent(meteor,easedProgress);
    const angle=Math.atan2(tangent.y,tangent.x);
    const normal={x:-tangent.y,y:tangent.x};
    const fadeIn=smoothstep(Math.min(progress/0.12,1));
    const fadeOut=smoothstep(Math.min((1-progress)/0.16,1));
    const flicker=0.88+Math.sin(meteor.elapsed*0.018+meteor.flickerPhase)*0.07
      +Math.sin(meteor.elapsed*0.043+meteor.flickerPhase)*0.035;
    const opacity=fadeIn*fadeOut*flicker*meteor.brightness;
    const tailProgress=Math.min(progress,meteor.tailFraction);
    const tailPoints=[];
    const tailSteps=22;

    for(let i=0;i<=tailSteps;i++){
      const position=progress-tailProgress+(tailProgress*i/tailSteps);
      const point=meteorPoint(meteor,position);
      const localTangent=meteorTangent(meteor,position);
      const localNormal={x:-localTangent.y,y:localTangent.x};
      const curve=Math.sin(position*19+meteor.wobblePhase)*meteor.headSize*0.34
        +Math.sin(position*37+meteor.wobblePhase*0.7)*meteor.headSize*0.13;
      tailPoints.push({
        x:point.x+localNormal.x*curve,
        y:point.y+localNormal.y*curve,
        normal:localNormal
      });
    }

    const tailStart=tailPoints[0];
    const tailEnd=tailPoints[tailPoints.length-1];
    const tailGradient=context.createLinearGradient(tailStart.x,tailStart.y,tailEnd.x,tailEnd.y);
    tailGradient.addColorStop(0,'rgba(190,205,235,0)');
    tailGradient.addColorStop(0.35,`rgba(${meteor.glowColor},${opacity*0.025})`);
    tailGradient.addColorStop(0.78,`rgba(${meteor.color},${opacity*0.12})`);
    tailGradient.addColorStop(1,`rgba(242,246,255,${opacity*0.38})`);

    context.save();
    context.lineCap='round';
    context.lineJoin='round';
    const upperEdge=[];
    const lowerEdge=[];
    for(let i=0;i<tailPoints.length;i++){
      const point=tailPoints[i];
      const taper=i/(tailPoints.length-1);
      const widthAtPoint=meteor.headSize*(0.025+0.4*Math.pow(taper,1.35))
        *(0.88+Math.sin(i*0.72+meteor.wobblePhase)*0.12);
      upperEdge.push({x:point.x+point.normal.x*widthAtPoint,y:point.y+point.normal.y*widthAtPoint});
      lowerEdge.push({x:point.x-point.normal.x*widthAtPoint,y:point.y-point.normal.y*widthAtPoint});
    }
    context.beginPath();
    context.moveTo(upperEdge[0].x,upperEdge[0].y);
    for(const point of upperEdge.slice(1)) context.lineTo(point.x,point.y);
    for(let i=lowerEdge.length-1;i>=0;i--) context.lineTo(lowerEdge[i].x,lowerEdge[i].y);
    context.closePath();
    context.shadowColor=`rgba(${meteor.glowColor},${opacity*0.16})`;
    context.shadowBlur=meteor.headSize*1.1;
    context.fillStyle=tailGradient;
    context.fill();

    context.beginPath();
    context.moveTo(tailPoints[0].x,tailPoints[0].y);
    for(let i=1;i<tailPoints.length-1;i++){
      const midpointX=(tailPoints[i].x+tailPoints[i+1].x)/2;
      const midpointY=(tailPoints[i].y+tailPoints[i+1].y)/2;
      context.quadraticCurveTo(tailPoints[i].x,tailPoints[i].y,midpointX,midpointY);
    }
    context.lineTo(tailEnd.x,tailEnd.y);
    context.shadowColor=`rgba(${meteor.color},${opacity*0.18})`;
    context.shadowBlur=meteor.headSize*1.4;
    context.strokeStyle=tailGradient;
    context.lineWidth=meteor.headSize*0.72;
    context.stroke();

    context.shadowBlur=meteor.headSize*0.8;
    context.globalAlpha=0.72;
    context.strokeStyle=tailGradient;
    context.lineWidth=meteor.headSize*0.34;
    context.stroke();
    context.globalAlpha=1;

    const streakGradient=context.createLinearGradient(
      head.x-tangent.x*meteor.bodyLength,head.y-tangent.y*meteor.bodyLength,head.x,head.y
    );
    streakGradient.addColorStop(0,'rgba(255,255,255,0)');
    streakGradient.addColorStop(0.48,`rgba(229,235,255,${opacity*0.38})`);
    streakGradient.addColorStop(1,`rgba(255,255,255,${opacity})`);
    context.beginPath();
    context.moveTo(head.x-tangent.x*meteor.bodyLength,head.y-tangent.y*meteor.bodyLength);
    context.quadraticCurveTo(
      head.x-tangent.x*meteor.bodyLength*0.42+normal.x*meteor.headSize*0.2,
      head.y-tangent.y*meteor.bodyLength*0.42+normal.y*meteor.headSize*0.2,
      head.x,head.y
    );
    context.shadowColor=`rgba(226,235,255,${opacity*0.2})`;
    context.shadowBlur=meteor.headSize*0.9;
    context.strokeStyle=streakGradient;
    context.lineWidth=meteor.headSize*0.48;
    context.stroke();

    const glow=context.createRadialGradient(head.x,head.y,0,head.x,head.y,meteor.headSize*2.4);
    glow.addColorStop(0,`rgba(255,250,255,${opacity*0.48})`);
    glow.addColorStop(0.28,`rgba(${meteor.glowColor},${opacity*0.16})`);
    glow.addColorStop(0.62,`rgba(${meteor.color},${opacity*0.08})`);
    glow.addColorStop(1,`rgba(${meteor.color},0)`);
    context.shadowBlur=meteor.headSize*0.7;
    context.fillStyle=glow;
    context.beginPath();
    context.arc(head.x,head.y,meteor.headSize*2.4,0,Math.PI*2);
    context.fill();

    const coreRadius=Math.min(2.5,meteor.headSize*0.78);
    const core=context.createRadialGradient(head.x,head.y,0,head.x,head.y,coreRadius);
    core.addColorStop(0,`rgba(255,255,255,${opacity})`);
    core.addColorStop(0.55,`rgba(255,245,255,${opacity*0.88})`);
    core.addColorStop(0.82,`rgba(${meteor.glowColor},${opacity*0.36})`);
    core.addColorStop(1,`rgba(${meteor.color},0)`);
    context.shadowBlur=meteor.headSize*0.45;
    context.fillStyle=core;
    context.beginPath();
    context.arc(head.x,head.y,coreRadius,0,Math.PI*2);
    context.fill();

    if(animate) emitMeteorSparks(meteor,head,tangent,normal,elapsed);
    context.restore();
  }

  drawMeteorSparks(animate,elapsed);
}

function createMeteor(index){
  const mobile=width<600;
  const start={x:-width*0.1,y:height*(0.01+Math.random()*0.12)};
  const end={x:width*(1.02+Math.random()*0.1),y:height*(0.96+Math.random()*0.12)};
  const angle=(35+Math.random()*15)*Math.PI/180;
  const firstControlDistance=Math.min(width,height)*(0.3+Math.random()*0.16);
  const lastControlDistance=Math.min(width,height)*(0.24+Math.random()*0.16);
  const control1={
    x:start.x+Math.cos(angle)*firstControlDistance,
    y:start.y+Math.sin(angle)*firstControlDistance
  };
  const control2={
    x:end.x-Math.cos(angle+0.12)*lastControlDistance,
    y:end.y-Math.sin(angle+0.12)*lastControlDistance
  };
  const headSize=(mobile?2.2:2.9)*(index===0?1:0.84)*(0.9+Math.random()*0.2);
  const bodyLength=headSize*(1.5+Math.random()*0.35);
  const tailLength=bodyLength*(5+Math.random()*3);
  const pathLength=Math.hypot(end.x-start.x,end.y-start.y);
  return{
    start,control1,control2,end,
    headSize,bodyLength,
    tailFraction:Math.min(0.3,tailLength/pathLength),
    color:index===0?'180,105,255':'112,145,255',
    glowColor:index===0?'239,119,255':'142,177,255',
    brightness:index===0?0.92:0.82+Math.random()*0.12,
    flickerPhase:Math.random()*Math.PI*2,
    wobblePhase:Math.random()*Math.PI*2,
    sparks:0,
    elapsed:0,
    duration:8000+Math.random()*4000
  };
}

function meteorPoint(meteor,t){
  const inverse=1-t;
  return{
    x:inverse**3*meteor.start.x+3*inverse**2*t*meteor.control1.x
      +3*inverse*t**2*meteor.control2.x+t**3*meteor.end.x,
    y:inverse**3*meteor.start.y+3*inverse**2*t*meteor.control1.y
      +3*inverse*t**2*meteor.control2.y+t**3*meteor.end.y
  };
}

function meteorTangent(meteor,t){
  const inverse=1-t;
  const x=3*inverse**2*(meteor.control1.x-meteor.start.x)
    +6*inverse*t*(meteor.control2.x-meteor.control1.x)
    +3*t**2*(meteor.end.x-meteor.control2.x);
  const y=3*inverse**2*(meteor.control1.y-meteor.start.y)
    +6*inverse*t*(meteor.control2.y-meteor.control1.y)
    +3*t**2*(meteor.end.y-meteor.control2.y);
  const magnitude=Math.hypot(x,y)||1;
  return{x:x/magnitude,y:y/magnitude};
}

function emitMeteorSparks(meteor,head,tangent,normal,elapsed){
  meteor.sparks-=elapsed;
  if(meteor.sparks>0) return;
  meteor.sparks=55+Math.random()*105;
  const count=1+(Math.random()<0.32?1:0);
  for(let i=0;i<count&&meteorSparks.length<48;i++){
    const spread=(Math.random()-0.5)*meteor.headSize*1.8;
    const speed=0.025+Math.random()*0.11;
    meteorSparks.push({
      x:head.x+normal.x*spread,
      y:head.y+normal.y*spread,
      vx:-tangent.x*speed+(Math.random()-0.5)*0.075,
      vy:-tangent.y*speed+(Math.random()-0.5)*0.075,
      size:0.5+Math.random()*0.5,
      opacity:0.22+Math.random()*0.48,
      color:meteor.color,
      age:0,
      lifetime:450+Math.random()*900
    });
  }
}

function drawMeteorSparks(animate,elapsed){
  meteorSparks=meteorSparks.filter(spark=>{
    if(animate){
      spark.age+=elapsed;
      spark.x+=spark.vx*elapsed;
      spark.y+=spark.vy*elapsed;
    }
    if(spark.age>=spark.lifetime) return false;
    const life=1-spark.age/spark.lifetime;
    const flicker=0.75+Math.sin(spark.age*0.035)*0.25;
    const alpha=spark.opacity*life*life*flicker;
    context.fillStyle=`rgba(${spark.color},${alpha})`;
    context.shadowColor=`rgba(${spark.color},${alpha})`;
    context.shadowBlur=spark.size*0.8;
    context.beginPath();
    context.arc(spark.x,spark.y,spark.size*(0.55+life*0.45),0,Math.PI*2);
    context.fill();
    context.shadowBlur=0;
    return true;
  });
}

function smoothstep(value){
  return value*value*(3-2*value);
}

function drawScorpius(time,animate){
  const mobile=width<600;
  const constellationWidth=mobile?Math.min(132,width*0.36):Math.min(245,width*0.22);
  const constellationHeight=mobile?Math.min(250,height*0.36):Math.min(390,height*0.5);
  const originX=width-constellationWidth-(mobile?12:Math.max(28,width*0.045));
  const originY=mobile?Math.max(110,height-constellationHeight-26):Math.max(110,height*0.2);
  const points=[
    [0.62,0.08],[0.78,0.10],[0.94,0.14],
    [0.70,0.22],[0.61,0.34],[0.50,0.43],
    [0.39,0.52],[0.28,0.61],[0.20,0.72],
    [0.24,0.82],[0.36,0.88],[0.49,0.83],
    [0.53,0.73],[0.44,0.72]
  ];
  const connections=[
    [0,1],[1,2],[0,3],[1,3],[3,4],[4,5],[5,6],[6,7],
    [7,8],[8,9],[9,10],[10,11],[11,12],[12,13],[13,10]
  ];

  context.lineWidth=0.8;
  context.strokeStyle='rgba(190,205,225,0.18)';
  for(const [from,to] of connections){
    context.beginPath();
    context.moveTo(originX+points[from][0]*constellationWidth,originY+points[from][1]*constellationHeight);
    context.lineTo(originX+points[to][0]*constellationWidth,originY+points[to][1]*constellationHeight);
    context.stroke();
  }

  for(let i=0;i<points.length;i++){
    const [x,y]=points[i];
    const twinkle=animate?(Math.sin(time*0.00055+i*1.7)+1)/2:0.5;
    const radius=i===5?2.2:1.35+(i%3)*0.2;
    context.fillStyle=i===5
      ?`rgba(255,205,170,${0.68+twinkle*0.22})`
      :`rgba(225,235,250,${0.62+twinkle*0.3})`;
    context.beginPath();
    context.arc(originX+x*constellationWidth,originY+y*constellationHeight,radius,0,Math.PI*2);
    context.fill();
  }
}

function addInteractionParticle(x,y,vx,vy,lifetime,color,opacity){
  if(interactionParticles.length>=maxInteractionParticles) interactionParticles.shift();
  interactionParticles.push({x,y,vx,vy,lifetime,remaining:lifetime,color,opacity,radius:Math.random()*0.8+0.55});
}

function handleMouseMove(event){
  if(!lastPointer){
    lastPointer={x:event.clientX,y:event.clientY};
    return;
  }
  const dx=event.clientX-lastPointer.x;
  const dy=event.clientY-lastPointer.y;
  const distance=Math.hypot(dx,dy);
  const steps=Math.min(5,Math.floor(distance/18));
  if(!steps) return;
  const colors=['190,220,255','232,239,248','205,195,245'];
  for(let i=1;i<=steps;i++){
    const progress=i/steps;
    const x=lastPointer.x+dx*progress;
    const y=lastPointer.y+dy*progress;
    addInteractionParticle(
      x+(Math.random()-0.5)*5,
      y+(Math.random()-0.5)*5,
      (Math.random()-0.5)*0.025,
      (Math.random()-0.5)*0.025,
      420+Math.random()*300,
      colors[Math.floor(Math.random()*colors.length)],
      0.42
    );
  }
  lastPointer={x:event.clientX,y:event.clientY};
}

function handleMouseClick(event){
  const colors=['190,220,255','232,239,248','205,195,245'];
  for(let i=0;i<10;i++){
    const angle=(Math.PI*2*i)/10+Math.random()*0.35;
    const speed=0.025+Math.random()*0.035;
    addInteractionParticle(
      event.clientX,
      event.clientY,
      Math.cos(angle)*speed,
      Math.sin(angle)*speed,
      480+Math.random()*180,
      colors[Math.floor(Math.random()*colors.length)],
      0.5
    );
  }
  if(clickWaves.length>=2) clickWaves.shift();
  clickWaves.push({x:event.clientX,y:event.clientY,elapsed:0,lifetime:560});
}

function clearInteractionEffects(){
  interactionParticles=[];
  clickWaves=[];
  lastPointer=null;
}

function updatePointerListeners(){
  const shouldEnable=desktopPointer.matches&&!reducedMotion.matches;
  if(shouldEnable===pointerListenersEnabled) return;
  pointerListenersEnabled=shouldEnable;
  if(shouldEnable){
    window.addEventListener('mousemove',handleMouseMove,{passive:true});
    window.addEventListener('click',handleMouseClick,{passive:true});
  }else{
    window.removeEventListener('mousemove',handleMouseMove);
    window.removeEventListener('click',handleMouseClick);
    clearInteractionEffects();
  }
}

function drawInteractionEffects(time,animate){
  if(!animate){
    clearInteractionEffects();
    lastInteractionDrawTime=0;
    return;
  }
  const elapsed=lastInteractionDrawTime?Math.min(time-lastInteractionDrawTime,100):0;
  lastInteractionDrawTime=time;

  interactionParticles=interactionParticles.filter(particle=>{
    particle.remaining-=elapsed;
    particle.x+=particle.vx*elapsed;
    particle.y+=particle.vy*elapsed;
    if(particle.remaining<=0) return false;
    const opacity=particle.opacity*(particle.remaining/particle.lifetime)**2;
    context.fillStyle=`rgba(${particle.color},${opacity})`;
    context.beginPath();
    context.arc(particle.x,particle.y,particle.radius,0,Math.PI*2);
    context.fill();
    return true;
  });

  clickWaves=clickWaves.filter(wave=>{
    wave.elapsed+=elapsed;
    const progress=Math.min(wave.elapsed/wave.lifetime,1);
    if(progress>=1) return false;
    context.strokeStyle=`rgba(210,222,248,${0.2*(1-progress)})`;
    context.lineWidth=0.8;
    context.beginPath();
    context.arc(wave.x,wave.y,4+progress*23,0,Math.PI*2);
    context.stroke();
    return true;
  });
}

function animateStarfield(time){
  frameId=0;
  if(document.hidden) return;
  if(time-lastFrame>=(width<600?40:33)){
    lastFrame=time;
    drawStarfield(time,true);
  }
  frameId=window.requestAnimationFrame(animateStarfield);
}

function startStarfield(){
  if(!frameId&&!reducedMotion.matches&&!document.hidden){
    frameId=window.requestAnimationFrame(animateStarfield);
  }
}

function stopStarfield(){
  if(frameId){
    window.cancelAnimationFrame(frameId);
    frameId=0;
  }
}

resizeStarfield();
updatePointerListeners();
startStarfield();
window.addEventListener('resize',resizeStarfield,{passive:true});
desktopPointer.addEventListener('change',updatePointerListeners);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    stopStarfield();
    clearInteractionEffects();
    lastInteractionDrawTime=0;
  }else startStarfield();
});
reducedMotion.addEventListener('change',()=>{
  stopStarfield();
  updatePointerListeners();
  drawStarfield(0,false);
  startStarfield();
});
</script>
</body>
</html>
