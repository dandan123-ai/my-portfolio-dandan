<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的数字空间</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f4f6ff;background-color:#080b16;overflow-x:hidden;isolation:isolate}
.background-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2}
body::before{content:"";position:fixed;inset:0;background:rgba(8,11,22,.58);z-index:-1;pointer-events:none}
nav{padding:24px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18}
.logo{font-weight:bold;letter-spacing:2px}.logo span{color:#67e8f9}
nav div:last-child{display:flex;gap:22px}
nav a{color:#b9c4e8;text-decoration:none}
nav a:hover{color:#67e8f9}
main{min-height:calc(100vh - 73px);max-width:1000px;margin:auto;padding:40px 25px;display:grid;place-items:center}
.content-area{width:100%;min-height:45vh;font-size:clamp(2rem,7vw,5rem);line-height:1.2}
@media(max-width:480px){nav{padding:20px 6%}nav div:last-child{gap:14px}main{min-height:calc(100vh - 65px);padding:32px 20px}}
</style>
</head>
<body>
<video class="background-video" autoplay loop muted playsinline aria-hidden="true" tabindex="-1">
  <source src="images/16937207_2160_3840_24fps.mp4" type="video/mp4">
</video>
<nav>
  <div class="logo">MY<span>SPACE</span>_</div>
  <div><a href="index.html">返回首页</a><a href="about.html">关于我</a></div>
</nav>
<main><div class="content-area" aria-label="可填写内容的区域"></div></main>
<script>
document.querySelector('.background-video').addEventListener('error',event=>event.currentTarget.remove());
</script>
</body>
</html>
