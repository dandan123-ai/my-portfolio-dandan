<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的技能</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f4f6ff;background-color:#030406;background-image:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url("images/pexels-ashford-marx-1565533-36710529.jpg");background-size:cover;background-position:center;overflow-x:hidden}
nav{padding:24px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18}
.logo{font-weight:bold;letter-spacing:2px}.logo span{color:#67e8f9}
nav div:last-child{display:flex;gap:22px}
nav a{color:#b9c4e8;text-decoration:none}
nav a:hover{color:#67e8f9}
main{max-width:1000px;margin:auto;padding:90px 25px 80px}
.eyebrow{color:#67e8f9;letter-spacing:3px;font-size:12px}
h1{font-size:clamp(40px,7vw,68px);line-height:1.1;margin:18px 0 14px}
.intro{max-width:620px;color:#aab4d0;line-height:1.9;margin:0}
.skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:54px}
.skill-item{min-height:210px;padding:30px;border:1px solid #8b9cff45;border-radius:20px;background:linear-gradient(145deg,#ffffff12,#ffffff06);backdrop-filter:blur(10px)}
.icon{display:grid;place-items:center;width:48px;height:48px;border:1px solid #67e8f955;border-radius:14px;color:#67e8f9;font-size:23px;margin-bottom:24px}
h2{font-size:22px;margin:0 0 12px}
.skill-item p{color:#aab4d0;line-height:1.8;margin:0}
@media(max-width:600px){nav{padding:20px 6%}nav div:last-child{gap:14px}main{padding:64px 20px}.skill-list{grid-template-columns:1fr;gap:16px;margin-top:36px}.skill-item{min-height:0;padding:24px}.icon{margin-bottom:18px}}
</style>
</head>
<body>
<nav>
  <div class="logo">MY<span>SPACE</span>_</div>
  <div><a href="index.html">返回首页</a><a href="skills.html">返回技能与兴趣</a></div>
</nav>
<main>
  <div class="eyebrow">MY SKILLS</div>
  <h1>我的技能</h1>
  <p class="intro">正在认识自己，也不急着给自己贴上标签。</p>
  <section class="skill-list" aria-label="技能">
    <article class="skill-item">
      <div class="icon" aria-hidden="true">⌘</div>
      <h2>我哪里有什么技能</h2>
      <p>先从好奇和尝试开始，慢慢发现自己擅长的事。</p>
    </article>
  </section>
</main>
</body>
</html>
